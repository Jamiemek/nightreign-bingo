<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nightreign Bingo Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dark-bg: #0b0d11;
    --accent-blue: #4b6cb7;
    --accent-purple: #7c4eff;
    --metal-silver: #c2c6ca;
    --card-bg: #1a1e24;
    --text-light: #e3e6eb;
    --shadow-deep: 0 8px 24px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark-bg);
    color: var(--text-light);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    color: var(--metal-silver);
    font-size: 1.1rem;
    font-weight: 600;
    text-align: center;
    padding: 6px 0;
    box-shadow: var(--shadow-deep);
    letter-spacing: 0.5px;
  }

  nav {
    width: 100%;
    display: flex;
    justify-content: center;
    background: #121418;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 6px 0;
    gap: 20px;
  }
  nav a {
    color: var(--metal-silver);
    text-decoration: none;
    font-weight: 500;
    padding: 6px 18px;
    border-radius: 6px;
    transition: background 0.3s, color 0.3s;
  }
  nav a:hover, nav a.active {
    background: rgba(124,78,255,0.15);
    color: var(--accent-purple);
  }

  main {
    width: 100%;
    max-width: 900px;
    margin: 25px auto;
    padding: 20px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: var(--shadow-deep);
    position: relative;
  }

  .page { display: none; animation: fadeIn 0.4s ease; }
  .active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h1 { text-align: center; color: var(--accent-purple); margin-bottom: 24px; }

  #bingo-board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    width: 100%;
    max-width: 600px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border: 2px solid var(--accent-blue);
    border-radius: 6px;
    overflow: hidden;
  }
  .cell {
    background: #252a33;
    border: 1px solid var(--accent-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-light);
    font-weight: 600;
    overflow: hidden;
    padding: 10px;
    transition: background 0.2s;
  }
  .cell:hover { background: #323845; }

  .cell span {
    display: block;
    width: 95%;
    text-align: center;
    word-wrap: break-word;
    font-size: clamp(0.7rem, 1.1vw, 0.9rem);
    line-height: 1.2;
  }

  button {
    background: var(--accent-blue);
    color: var(--metal-silver);
    border: none;
    padding: 8px 18px;
    border-radius: 10px;
    margin: 4px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(75,108,183,0.4);
    transition: transform 0.2s, background 0.3s;
  }
  button:hover { background: var(--accent-purple); transform: translateY(-2px); }

  #reset-defaults {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 0.7rem;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(124,78,255,0.2);
    color: var(--metal-silver);
    border: 1px solid rgba(124,78,255,0.3);
    cursor: pointer;
    box-shadow: none;
    transition: background 0.3s;
  }
  #reset-defaults:hover { background: rgba(124,78,255,0.4); }

  #item-list {
    list-style: none;
    padding: 0;
    max-width: 600px;
    margin: 0 auto;
  }
  #item-list li {
    background: #1f2329;
    border-left: 4px solid var(--accent-purple);
    border-radius: 10px;
    padding: 10px 15px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-deep);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: transform 0.2s;
  }
  #item-list li:hover { transform: translateX(4px); background: #282c34; }

  #item-list .text {
    flex-grow: 1;
    font-size: 0.9rem;
    color: var(--text-light);
    word-wrap: break-word;
  }

  #item-list input.edit-input {
    flex-grow: 1;
    background: #242830;
    border: 1px solid #444;
    color: var(--text-light);
    border-radius: 6px;
    padding: 6px;
    margin-right: 10px;
    font-size: 0.9rem;
  }

  .center-checkbox {
    margin-right: 8px;
    transform: scale(1.2);
    cursor: pointer;
  }

  #add-item {
    display: flex;
    justify-content: center;
    margin-top: 24px;
  }
  #add-item input {
    width: 280px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #444;
    margin-right: 10px;
    font-size: 1rem;
    background: #1e2127;
    color: var(--text-light);
  }
</style>
</head>
<body>

<header>🌒 Elden Ring: Nightreign Bingo</header>

<nav>
  <a href="#" id="nav-bingo" class="active">🎲 Bingo Board</a>
  <a href="#" id="nav-list">📝 Edit List</a>
</nav>

<main>
  <section id="bingo-page" class="page active">
    <h1>Nightreign Bingo Board</h1>
    <div id="bingo-board"></div>
    <div style="text-align:center;">
      <button id="generate">🔁 Generate</button>
      <button id="getpng">📸 Get PNG</button>
    </div>
  </section>

  <section id="list-page" class="page">
    <button id="reset-defaults" title="Restore Default Challenges">♻</button>
    <h1>Edit Challenge List</h1>
    <ul id="item-list"></ul>
    <div id="add-item">
      <input type="text" id="new-item" placeholder="Add new challenge..." />
      <button id="add-btn">➕ Add</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const bingoPage = document.getElementById('bingo-page');
const listPage = document.getElementById('list-page');
const navBingo = document.getElementById('nav-bingo');
const navList = document.getElementById('nav-list');
const bingoBoard = document.getElementById('bingo-board');
const itemList = document.getElementById('item-list');
const newItemInput = document.getElementById('new-item');
const resetBtn = document.getElementById('reset-defaults');

let items = JSON.parse(localStorage.getItem('bingoItems') || "null");
if (!items) {
  items = defaultItems.map(i => ({ text: i, center: false }));
  localStorage.setItem('bingoItems', JSON.stringify(items));
}

function saveItems() {
  localStorage.setItem('bingoItems', JSON.stringify(items));
}

function renderList() {
  itemList.innerHTML = '';
  items.forEach((item, index) => {
    const li = document.createElement('li');
    li.innerHTML = `
      <input type="checkbox" class="center-checkbox" data-index="${index}" ${item.center ? 'checked' : ''} title="Eligible for center square">
      <span class="text">${item.text}</span>
      <div>
        <button class="edit" data-index="${index}">✏️ Edit</button>
        <button class="delete" data-index="${index}">🗑 Delete</button>
      </div>
    `;
    itemList.appendChild(li);
  });
}

function renderBingo() {
  const availableItems = [...items];
  if (availableItems.length < 25) {
    alert("You need at least 25 challenges to fill the board!");
    return;
  }
  const centerEligible = items.filter(i => i.center);
  const centerChoice = centerEligible.length ? centerEligible[Math.floor(Math.random() * centerEligible.length)].text : availableItems[Math.floor(Math.random() * availableItems.length)].text;

  const selected = [];
  while (selected.length < 24) {
    const random = availableItems[Math.floor(Math.random() * availableItems.length)].text;
    if (!selected.includes(random) && random !== centerChoice) selected.push(random);
  }

  bingoBoard.innerHTML = '';
  let index = 0;
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const span = document.createElement('span');
      if (r === 2 && c === 2) span.textContent = centerChoice;
      else span.textContent = selected[index++];
      cell.appendChild(span);
      bingoBoard.appendChild(cell);
    }
  }
}

itemList.addEventListener('click', e => {
  if (e.target.classList.contains('delete')) {
    items.splice(e.target.dataset.index, 1);
    saveItems();
    renderList();
  }
  if (e.target.classList.contains('edit')) {
    const index = e.target.dataset.index;
    const li = e.target.closest('li');
    const textEl = li.querySelector('.text');
    const editBtn = e.target;
    const input = document.createElement('input');
    input.className = 'edit-input';
    input.value = textEl.textContent;
    li.replaceChild(input, textEl);
    editBtn.textContent = '💾 Save';
    input.focus();
    const saveEdit = () => {
      items[index].text = input.value.trim() || 'Untitled Challenge';
      saveItems();
      renderList();
    };
    editBtn.onclick = saveEdit;
    input.addEventListener('keypress', ev => { if (ev.key === 'Enter') saveEdit(); });
  }
});

itemList.addEventListener('change', e => {
  if (e.target.classList.contains('center-checkbox')) {
    const i = e.target.dataset.index;
    items[i].center = e.target.checked;
    saveItems();
  }
});

document.getElementById('generate').addEventListener('click', renderBingo);
document.getElementById('getpng').addEventListener('click', () => {
  html2canvas(bingoBoard).then(canvas => {
    const link = document.createElement('a');
    link.download = 'nightreign-bingo.png';
    link.href = canvas.toDataURL();
    link.click();
  });
});

document.getElementById('add-btn').addEventListener('click', () => {
  const val = newItemInput.value.trim();
  if (!val) return;
  items.push({ text: val, center: false });
  saveItems();
  newItemInput.value = '';
  renderList();
});

resetBtn.addEventListener('click', () => {
  if (confirm("Restore default Nightreign challenges? This will remove your custom list.")) {
    items = defaultItems.map(i => ({ text: i, center: false }));
    saveItems();
    renderList();
    renderBingo();
  }
});

navBingo.addEventListener('click', () => {
  listPage.classList.remove('active');
  bingoPage.classList.add('active');
  navList.classList.remove('active');
  navBingo.classList.add('active');
});
navList.addEventListener('click', () => {
  bingoPage.classList.remove('active');
  listPage.classList.add('active');
  navBingo.classList.remove('active');
  navList.classList.add('active');
  renderList();
});

renderBingo();
</script>
</body>
</html>

</body>
</html>
